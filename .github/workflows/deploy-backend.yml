name: Deploy Backend to Render

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build & Test
        run: dotnet test backend/Backend.Tests/Backend.Tests.csproj --configuration Release

  deploy:
    name: Deploy to Render
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Trigger Render Deploy Hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is missing! Add it in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Triggering deployment on Render..."
          response=$(curl -s -w "\n%{http_code}" -X POST "$DEPLOY_HOOK_URL")
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Successfully triggered Render deployment!"
            echo "Response: $body"
          else
            echo "::error::Render deploy hook failed with HTTP status $http_code: $body"
            exit 1
          fi
