services:
  - type: web
    name: school-management-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: school-management-db
          property: connectionString
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: SchoolManagementApp
      - key: Jwt__Audience
        value: SchoolManagementApp
      - key: FRONTEND_ORIGIN
        value: https://school-management-net-chi.vercel.app

databases:
  - name: school-management-db
    databaseName: school_db
    user: school_user
    plan: free
